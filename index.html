<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Personal portfolio and resume website" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="profile-art">
        <img src="assets/profile.svg" alt="Profile placeholder" />
      </div>
      <button class="menu-button" aria-label="메뉴 열기">☰</button>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="#home">Home <span>⌂</span></a>
        <a href="#about">About <span>◎</span></a>
        <a href="#experience">Experience <span>★</span></a>
        <a href="#skills">Skills <span>◆</span></a>
        <a href="#portfolio">Portfolio <span>▣</span></a>
        <a href="#contact">Contact <span>✉</span></a>
      </nav>
      <div class="social" id="sidebar-social"></div>
    </aside>

    <main class="content">
      <section class="hero panel" id="home">
        <div>
          <p class="eyebrow">I'm</p>
          <h1 id="hero-name">YOUR NAME</h1>
          <p class="roles" id="hero-roles"></p>
        </div>
        <div class="hero-figure" aria-hidden="true">
          <img src="assets/hero.svg" alt="" />
        </div>
      </section>

      <section class="action-row">
        <a id="resume-link" class="action dark" href="#">↓ Resume</a>
        <a class="action coral" href="#contact">✦ Contact Me</a>
      </section>

      <section class="panel" id="about">
        <header class="section-title"><h2>About Me</h2></header>
        <div class="about-grid">
          <img class="about-image" src="assets/about.svg" alt="About placeholder" />
          <div>
            <p id="about-text"></p>
            <a class="button" href="#contact">Contact Me</a>
          </div>
        </div>
      </section>

      <section class="panel" id="skills">
        <header class="section-title"><h2>Skills</h2></header>
        <div class="skills-grid" id="skills-list"></div>
      </section>

      <section class="panel" id="education">
        <header class="section-title"><h2>Education</h2></header>
        <div class="timeline-grid" id="education-list"></div>
      </section>

      <section class="panel" id="experience">
        <header class="section-title"><h2>Experience</h2></header>
        <div class="timeline-grid" id="experience-list"></div>
      </section>

      <section class="panel" id="portfolio">
        <header class="section-title"><h2>Portfolio</h2></header>
        <div class="filters" id="filters"></div>
        <div class="project-grid" id="project-list"></div>
      </section>

      <section class="panel" id="contact">
        <header class="section-title"><h2>Contact</h2></header>
        <div class="contact-grid">
          <div id="contact-info"></div>
          <form class="contact-form" onsubmit="event.preventDefault(); alert('정적 사이트 데모입니다. 폼 서비스(Formspree 등)를 연결하면 실제 전송할 수 있어요.');">
            <input type="text" placeholder="Your Name" aria-label="Your Name">
            <input type="email" placeholder="Your Email" aria-label="Your Email">
            <input type="text" placeholder="Subject" aria-label="Subject">
            <textarea rows="5" placeholder="Message" aria-label="Message"></textarea>
            <button class="button" type="submit">Send Message</button>
          </form>
        </div>
      </section>

      <footer>
        <p>© <span id="footer-name">YOUR NAME</span>. All rights reserved.</p>
        <p class="credit">Layout inspired by the referenced HTML Codex resume template.</p>
      </footer>
    </main>
  </div>

  <a class="back-top" href="#home" aria-label="맨 위로">↑</a>

  <script src="site-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
