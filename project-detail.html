<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Portfolio project detail" />
  <title>Project Detail | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="project-detail-page">
  <main class="detail-shell">
    <div class="detail-container">
      <a class="detail-back" href="index.html#portfolio">← Portfolio로 돌아가기</a>

      <article id="project-detail" class="detail-card" aria-live="polite">
        <header class="detail-hero">
          <div class="detail-kicker">
            <span id="detail-category"></span>
            <span id="detail-date"></span>
          </div>
          <h1 id="detail-title">Project</h1>
          <p id="detail-organization" class="detail-organization"></p>
          <p id="detail-role" class="detail-role"></p>
          <p id="detail-description" class="detail-lead"></p>
          <div id="detail-actions" class="detail-actions"></div>
        </header>

        <div class="detail-content">
          <section class="detail-section">
            <p class="detail-section-label">Overview</p>
            <h2>프로젝트 소개</h2>
            <p id="detail-overview"></p>
          </section>

          <section class="detail-section">
            <p class="detail-section-label">Detail</p>
            <h2>상세 내용</h2>
            <div id="detail-detail" class="detail-prose"></div>
          </section>

          <section id="detail-media-section" class="detail-section" hidden>
            <p class="detail-section-label">Project Visuals</p>
            <h2>프로젝트 이미지</h2>
            <div id="detail-media" class="detail-media-grid"></div>
          </section>

          <section class="detail-section">
            <p class="detail-section-label">Contribution</p>
            <h2>주요 작업</h2>
            <ul id="detail-highlights" class="detail-highlight-list"></ul>
          </section>

          <section class="detail-section">
            <p class="detail-section-label">Keywords</p>
            <h2>주요 키워드</h2>
            <div id="detail-keywords" class="detail-keywords"></div>
          </section>
        </div>
      </article>
    </div>
  </main>

  <script src="site-data.js"></script>
  <script src="project-detail.js"></script>
</body>
</html>
